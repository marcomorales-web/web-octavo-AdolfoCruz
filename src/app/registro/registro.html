<h1>Build De Personajes</h1>

<div class="logo">
  <img src="assets/img/anime.jpg" alt="logo" />
</div>

<div class="page">
  <div class="login-container" @fadeSlide>

    <div class="form-container">
      <form>

        <input type="text" placeholder="Ingrese su nombre" />

        <input type="text" placeholder="Ingrese su primer apellido" />

        <input type="text" placeholder="Ingrese su segundo apellido" />

        <input type="email" placeholder="Ingrese su correo" />

        <input type="password" placeholder="Ingrese su contraseña" />

        <input type="password" placeholder="Confirme su contraseña" />

        <div class="botones">
          <button class="btn-gamer" routerLink="/login">
            Regresar
          </button>

          <button class="btn-gamer" routerLink="/login">
            Registrarte
          </button>
        </div>

      </form>
    </div>

    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>

  </div>
</div>
