<div class="build-page">
  <div class="left-column">
    <div class="cards-container">
      
      <div class="wheel" [style.top]="-(currentStep * 600) + 'px'">
        
        <div class="cardwrap" *ngFor="let card of cards; let i = index">
          
          <div class="card" [class.active]="i === currentStep">
            
            <h2>0{{ i + 1 }}</h2>
            <p>{{ card }}</p>
            
          </div>
        </div>
        
      </div>
    </div>
  </div>

  <div class="right-column">
    <section *ngIf="currentStep === 0" class="form-step">
      <h2>Información Básica</h2>
      <input [(ngModel)]="personaje" placeholder="Nombre del personaje" />
      <select [(ngModel)]="juego" (change)="onJuegoChange()">
        <option value="">Selecciona un juego</option>
        <option>Genshin Impact</option>
        <option>Honkai Star Rail</option>
      </select>
      <button (click)="nextStep()">Siguiente</button>
    </section>

    <section *ngIf="currentStep === 1" class="form-step">
      <h2>Equipamiento</h2>
      <div *ngFor="let eq of equipamientos; let i = index" class="equip-item">
        <input [(ngModel)]="eq.slot" placeholder="Slot" style="flex: 1;" readonly />
        <input [(ngModel)]="eq.nombre" placeholder="Item" style="flex: 2;" />
        <input [(ngModel)]="eq.stat" placeholder="Stat" style="flex: 1;" />
      </div>
      <button (click)="agregarEquipamiento()">+ Agregar</button>
      <div class="nav-buttons">
        <button (click)="prevStep()">Atras</button>
        <button (click)="nextStep()">Siguiente</button>
      </div>
    </section>

    <section *ngIf="currentStep === 2" class="form-step">
      <h2>Stats</h2>
      <div *ngFor="let stat of stats; let i = index" class="stat-item">
        <input [(ngModel)]="stat.nombre" placeholder="Stat" />
        <input [(ngModel)]="stat.valor" placeholder="Valor" />
      </div>
      <button (click)="agregarStat()">+ Agregar</button>
      <div class="nav-buttons">
        <button (click)="prevStep()">Atras</button>
        <button (click)="nextStep()">Siguiente</button>
      </div>
    </section>

    <section *ngIf="currentStep === 3" class="form-step">
      <h2>Notas</h2>
      <textarea [(ngModel)]="notas"></textarea>
      <div class="nav-buttons">
        <button (click)="prevStep()">Atras</button>
        <button (click)="guardarBuild()">Guardar</button>
      </div>
    </section>
  </div>
</div>
