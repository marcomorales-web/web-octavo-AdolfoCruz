<h1>Build De Personajes</h1>

<!-- LOGO -->
<div class="logo">
  <img src="assets/img/anime.jpg" alt="logo" />
</div>

<!-- CONTENEDOR LOGIN -->
<div class="login-container" @fadeSlide>
  <div class="circle circle-one"></div>

  <div class="form-container">
    <form>
      <input type="email" placeholder="Ingrese su correo" />

      <input type="password" placeholder="Ingrese su contraseña" />

      <a routerLink="/recuperar-contrasena" class="link"> Olvidé contraseña </a>

      <button class="btn-sesion" routerLink="/paguina-principal">Iniciar Sesión</button>

      <p class="register">
        ¿No tienes cuenta?
        <a routerLink="/registro">Regístrate aquí</a>
      </p>
    </form>
  </div>

  <div class="circle circle-two"></div>
</div>
