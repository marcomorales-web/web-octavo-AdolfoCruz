<h1>Build De Personajes</h1>

<div class="logo">
  <img src="assets/img/anime.jpg" alt="logo" />
</div>

<div class="page">
  <div class="login-container" @fadeSlide>
    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>

    <div class="form-container">
      <form (ngSubmit)="registrar()">
        <input
          type="text"
          placeholder="Ingrese su nombre"
          [(ngModel)]="usuario.nombre"
          name="nombre"
        />

        <input
          type="text"
          placeholder="Ingrese su primer apellido"
          [(ngModel)]="usuario.apellido1"
          name="apellido1"
        />

        <input
          type="text"
          placeholder="Ingrese su segundo apellido"
          [(ngModel)]="usuario.apellido2"
          name="apellido2"
        />

        <input
          type="email"
          placeholder="Ingrese su correo"
          [(ngModel)]="usuario.correo"
          name="correo"
        />

        <input
          type="password"
          placeholder="Ingrese su contraseña"
          [(ngModel)]="usuario.password"
          name="password"
        />

        <input
          type="password"
          placeholder="Confirme su contraseña"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
        />

        <div class="botones">
          <button type="button" class="btn-gamer" routerLink="/login">Regresar</button>

          <button type="submit" class="btn-gamer">Registrarte</button>
        </div>
      </form>
    </div>
  </div>
</div>
