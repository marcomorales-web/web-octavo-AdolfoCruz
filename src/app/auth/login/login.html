<h1>Build De Personajes</h1>

<div class="logo">
  <img src="assets/img/anime.jpg" alt="logo" />
</div>

<div class="login-container" @fadeSlide>
  <div class="circle circle-one"></div>
  <div class="circle circle-two"></div>

  <div class="form-container">
    <form (ngSubmit)="onLogin()">
      <input type="email" placeholder="Ingrese su correo" [(ngModel)]="correo" name="correo" />

      <input
        type="password"
        placeholder="Ingrese su contraseña"
        [(ngModel)]="password"
        name="password"
      />

      <p class="recuperar-contrasena">
        ¿Olvido su contraseña?
        <a routerLink="/recuperar-contrasena" class="link"> Recuperar contraseña </a>
      </p>

      <button type="submit" class="btn-sesion">Iniciar Sesión</button>

      <p class="registro">
        ¿No tienes cuenta?
        <a routerLink="/registro">Regístrate aquí</a>
      </p>
    </form>
  </div>
</div>
